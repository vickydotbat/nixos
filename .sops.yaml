# Replace this placeholder with the public key from:
#   age-keygen -y /nix/persist/secrets/sops/age/keys.txt
keys:
  - &solanine age16penp9h358n9nyk06lajtdtncks7tqd8ww4u0zuelmkzc9jfg5cszyq8em
  - &firelink age142lwvvtlu8v566ug6seyayesaf7dmreqjnpa5muwxg7cj9j8230qqq0px5
  - &saturnine age102qnahcnmm4a8z28mj7fl70zd7c2lk9v4929kjqpn2h882eks42sw2dwxs

creation_rules:
  - path_regex: secrets/hosts-solanine\.yaml$
    key_groups:
      - age:
          - *solanine
  - path_regex: secrets/hosts-firelink\.yaml$
    key_groups:
      - age:
          - *firelink
  - path_regex: secrets/hosts-saturnine\.yaml$
    key_groups:
      - age:
          - *saturnine
  - path_regex: secrets/wifi-home\.yaml$
    key_groups:
      - age:
          - *solanine
          - *saturnine
  # One key for the whole tailnet, so every host that should enrol without a
  # keyboard can read it. firelink is left out until it joins the tailnet.
  - path_regex: secrets/tailscale\.yaml$
    key_groups:
      - age:
          - *solanine
          - *saturnine
  # GitHub token for nix's flake fetcher. Unauthenticated fetches share a
  # 60-requests-per-hour limit per IP, which a few flake inputs exhaust on
  # their own. Every host that evaluates this flake needs to read it.
  - path_regex: secrets/nix-access-tokens\.yaml$
    key_groups:
      - age:
          - *solanine
          - *firelink
          - *saturnine
  - path_regex: secrets/users-admin\.yaml$
    key_groups:
      - age:
          - *solanine
          - *firelink
          - *saturnine
  - path_regex: secrets/users-vicky\.yaml$
    key_groups:
      - age:
          - *solanine
          - *saturnine
  # Every host that lists mattia in an account's `ssh.authorizedUsers` must be
  # able to decrypt this file. sops-install-secrets is all-or-nothing: one
  # undecryptable file leaves the host with no /run/secrets at all.
  - path_regex: secrets/users-mattia\.yaml$
    key_groups:
      - age:
          - *firelink
          - *solanine
          - *saturnine
